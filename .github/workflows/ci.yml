name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint and Typecheck
        run: pnpm lint

  test:
    name: Test & Boundary Verification
    runs-on: ubuntu-latest
    env:
      REDIS_TEST_URL: redis://localhost:6379
      DATABASE_URL: postgres://vichaar:vichaar_pass@localhost:5432/vichaar
      DATABASE_REPLICA_URL: postgres://vichaar:vichaar_pass@localhost:5433/vichaar
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start test dependencies with streaming replica
        run: docker compose -f infra/compose/docker-compose.yml up -d --wait postgres postgres-replica redis elasticmq

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Wait for ElasticMQ
        run: |
          for attempt in {1..30}; do
            if curl --silent --output /dev/null --connect-timeout 1 http://localhost:9324; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Pull isolated ClickHouse chaos image
        run: docker pull clickhouse/clickhouse-server:24.3-alpine

      - name: Run Tests (including boundary fixture)
        run: pnpm test

  security-audit:
    name: Security Audit & Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit (Threat Model #13)
        run: pnpm audit --prod

      - name: Run Gitleaks Secret Scanner (Threat Model #13)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
